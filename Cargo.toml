[package]
name = "elliott-3d"
version = "0.1.0"
edition = "2024"
description = "Tiny headless 3D modeler + software renderer, driven over MCP (stdio)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
